# Copy to settings.cfg next to psykinetic.exe, or just run launch.bat and
# the game will ask for these and write the file itself.
address=100.64.0.5
port=7777
token=paste-the-token-here
# Left out, player_id is made up on first run; keep it to stay the same
# player on the server. name is what others see.
name=Player
# The body your player wears, male or female; O in the game sets it too, and it
# shows from your next join.
body=male
# Your look beside it, set in O's Character section: build (lean, middling,
# heavy), stature (short, middling, tall), hair (cropped, bound, long, bald),
# hair_colour, beard (none, short, full), skin (1 lightest to 8 darkest), and a
# seed for the rest. Leave it out and the game picks one for you.
#look=seed=4242 build=heavy hair=long
# Sound volumes, 0 to 1 (1 is full, 0 is off); O in the game sets them too.
master_volume=1
sfx_volume=1
voice_volume=1
ambience_volume=1
ui_volume=1
music_volume=1
# Smoothing of the 3D view's edges: off, fxaa, smaa (the default) or msaa4
# (sharpest on thin shapes, heaviest on the graphics card); O sets it too.
antialias=smaa
